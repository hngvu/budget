server:
  port: ${PORT:8080}

spring:
  application:
    name: budget-api

  mvc:
    problemdetails:
      enabled: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:budget}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:postgres}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  web:
    error:
      include-message: always
      include-binding-errors: always

# Swagger / OpenAPI documentation
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

# Cấu hình JWT & Application parameters
app:
  jwt:
    # Secret key dạng base64 / hex (tối thiểu 256-bit cho HMAC-SHA256)
    secret: ${JWT_SECRET:a22342078709628c33731ed76959bbdf7d98f382b5ac8d16b32393bb937ca090}
    expiration-ms: ${JWT_EXPIRATION_MS:2592000000} # 30 ngày (30 * 24 * 3600 * 1000)
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
